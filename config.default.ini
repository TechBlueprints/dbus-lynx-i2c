[DEFAULT]
# Lynx Distributor I2C Fuse Monitor Configuration
#
# Copy this file to config.ini to customize. config.ini is git-ignored and
# survives updates; all settings are optional and default to the values here.

# Distributors to poll, comma-separated letters matching the DIP-switch
# address assignment (A=0x08, B=0x09, C=0x0A, D=0x0B). Label them
# left-to-right per Victron convention so alarms name the right unit.
# One service per distributor is published on D-Bus.
distributors = A, B

# Number of fuse positions actually populated per distributor, comma-separated
# in the same order as `distributors`. Unpopulated positions read as
# "blown/missing" on the wire; they are published as "Not used" and never
# alarmed. Default: 4 for every distributor.
# fuses_per_distributor = 4

# Optional fuse names per distributor (shown on the GX Fuses page in place
# of "Fuse 1".."Fuse 4"). Comma-separated, up to 4 entries, 16 bytes each
# (the Lynx Smart BMS firmware limit); leave an entry empty to keep the
# default label.
# fuse_names_a = Inverter, Solar, DC Panel
# fuse_names_b =

# How often to read each distributor's status byte (seconds, >= 0.5)
poll_interval = 5

# Adapter backend:
#   ch347       Waveshare CH347 in M2/HID mode (default)
#   kernel-i2c  any kernel /dev/i2c-N bus -- the CP2112 fallback
#               (hid-cp2112 is in the stock Venus kernel)
#   mock        no hardware; simulate from mock-state.json (development)
# adapter = ch347

# hidraw device node of the CH347 adapter. Auto-detected by USB VID:PID
# (1a86:55dc, HID interface 1) when omitted; set explicitly only if
# detection misfires or multiple CH347 adapters are attached.
# hidraw_device = /dev/hidraw0

# kernel-i2c only: the bus device node. Auto-detects a CP2112 by adapter
# name when omitted (on a Cerbo the internal buses are i2c-0..4, so a
# CP2112 lands on i2c-5). Note: i2c_speed_hz does not apply here -- the
# kernel driver sets the bus clock (CP2112 default 100 kHz).
# i2c_device = /dev/i2c-5

# I2C bus clock in Hz. The CH347 supports exactly 20000, 100000, 400000
# and 750000. Community-proven rates: ~50 kHz (ESPHome) and 100 kHz
# (twam/dbus-lynx-distributor, pyftdi default). Default is the
# conservative 20000; 100000 is a proven option if you want it.
# i2c_speed_hz = 20000

# Clock used for the DATA byte only (ch347 adapter). The distributor
# aborts its transmission ~60us into a byte; clocking it at 750 kHz
# finishes in ~11us and beats that window, while START/address/NACK/STOP
# stay at i2c_speed_hz. Measured: 39k reads with zero truncation vs
# ~0.24% at a flat 20 kHz. Must be >= i2c_speed_hz; 0 disables the burst
# read. See README "Truncated reads".
# data_speed_hz = 750000

# Mock mode: no hardware needed; distributors are simulated from
# mock-state.json next to the service (see mock_adapter.py for the
# scenario syntax). For development only.
# mock = false
